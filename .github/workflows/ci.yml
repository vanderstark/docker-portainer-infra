name: Portainer Stack CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.yml

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
          echo "✅ docker-compose.yml valid"

      - name: Lint Shell Scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
          exclude: .github

      - name: Check .env.example exists
        run: |
          test -f .env.example && echo "✅ .env.example exists" || (echo "❌ .env.example missing" && exit 1)

  test-deploy:
    name: Test Deploy (Staging)
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Create .env from example
        run: cp .env.example .env

      - name: Deploy Stack
        run: |
          docker compose up -d --quiet-pull
          sleep 10
          docker compose ps

      - name: Health Check
        run: |
          for i in {1..6}; do
            if curl -k -s -o /dev/null -w "%{http_code}" https://localhost:9443 | grep -q "200\|302\|401"; then
              echo "✅ Portainer responding"
              exit 0
            fi
            echo "⏳ Waiting for Portainer... ($i/6)"
            sleep 5
          done
          echo "❌ Portainer health check failed"
          docker compose logs portainer
          exit 1

      - name: Cleanup
        if: always()
        run: docker compose down -v

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [lint, test-deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        run: |
          git log --oneline --pretty=format:"- %s (%an)" $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD > changelog.txt || echo "- Initial release" > changelog.txt
          cat changelog.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body_path: changelog.txt
          draft: false
          prerelease: false